name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match manifest version
        run: |
          version=$(node -p 'require("./manifest.json").version')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version v${version}"
            exit 1
          fi

      - name: Package extension
        run: zip -r "pinsieve-${GITHUB_REF_NAME}.zip" manifest.json background content popup icons

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "pinsieve-${GITHUB_REF_NAME}.zip" --generate-notes
